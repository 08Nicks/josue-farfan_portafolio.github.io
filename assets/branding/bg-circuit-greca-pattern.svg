<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- Trazas ortogonales y diagonales a 45 grados (Circuito + Greca) -->
  <path d="M0 60 H20 L30 50 H50 L60 60 H70 L80 70 H100 L110 60 H120" stroke="rgba(212, 155, 87, 0.07)" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M60 0 V20 L50 30 V50 L60 60 V70 L70 80 V100 L60 110 V120" stroke="rgba(212, 155, 87, 0.07)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Greca escalonada prehispánica (Xicalcoliuhqui) en cuadrantes -->
  <path d="M10 10 H30 V25 H20 V18 H10 Z" stroke="rgba(212, 155, 87, 0.06)" stroke-width="1" fill="none"/>
  <path d="M110 10 H90 V25 H100 V18 H110 Z" stroke="rgba(212, 155, 87, 0.06)" stroke-width="1" fill="none"/>
  <path d="M10 110 H30 V95 H20 V102 H10 Z" stroke="rgba(212, 155, 87, 0.06)" stroke-width="1" fill="none"/>
  <path d="M110 110 H90 V95 H100 V102 H110 Z" stroke="rgba(212, 155, 87, 0.06)" stroke-width="1" fill="none"/>

  <!-- Nudo celta / Runa central en rombo -->
  <path d="M60 48 L72 60 L60 72 L48 60 Z" stroke="rgba(212, 155, 87, 0.09)" stroke-width="1" fill="none"/>
  <circle cx="60" cy="60" r="2.5" fill="rgba(245, 194, 120, 0.15)"/>

  <!-- Puntos de vía y pads de circuito -->
  <circle cx="20" cy="60" r="1.5" fill="rgba(212, 155, 87, 0.12)"/>
  <circle cx="100" cy="60" r="1.5" fill="rgba(212, 155, 87, 0.12)"/>
  <circle cx="60" cy="20" r="1.5" fill="rgba(212, 155, 87, 0.12)"/>
  <circle cx="60" cy="100" r="1.5" fill="rgba(212, 155, 87, 0.12)"/>
  <circle cx="30" cy="50" r="1.2" fill="rgba(212, 155, 87, 0.08)"/>
  <circle cx="80" cy="70" r="1.2" fill="rgba(212, 155, 87, 0.08)"/>
</svg>
