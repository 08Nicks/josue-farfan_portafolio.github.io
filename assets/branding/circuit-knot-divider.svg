<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 28" fill="none" preserveAspectRatio="xMidYMid meet">
  <!-- Trace Izquierda -->
  <line x1="20" y1="14" x2="160" y2="14" stroke="rgba(212,155,87,0.3)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="20" cy="14" r="3" fill="#d49b57"/>
  <circle cx="20" cy="14" r="1.2" fill="#0a0e17"/>
  
  <!-- Greca Prehispánica / Escalón Izquierdo -->
  <path d="M160 14 L175 6 H215 L225 14 H250 L260 22 H280 L290 14 H315" stroke="#d49b57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="215" cy="6" r="2" fill="#f5c278"/>
  <circle cx="280" cy="22" r="2" fill="#f5c278"/>

  <!-- Nodo Central: Runa Nórdica / Nudo Celta Cuaternario & Cruz Solar -->
  <g transform="translate(360, 14)">
    <!-- Rombo exterior de runa -->
    <path d="M0 -11 L14 0 L0 11 L-14 0 Z" stroke="#f5c278" stroke-width="1.6" fill="rgba(212,155,87,0.12)"/>
    <!-- Lazos de nudo celta -->
    <path d="M-8 -6 C-2 -12, 2 -12, 8 -6 C12 -2, 12 2, 8 6 C2 12, -2 12, -8 6 C-12 2, -12 -2, -8 -6 Z" stroke="#e53935" stroke-width="1.2" fill="none"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffd89b"/>
  </g>

  <!-- Greca Prehispánica / Escalón Derecho (Simétrico) -->
  <path d="M405 14 H430 L440 6 H460 L470 14 H495 L505 22 H545 L560 14" stroke="#d49b57" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="6" r="2" fill="#f5c278"/>
  <circle cx="505" cy="22" r="2" fill="#f5c278"/>

  <!-- Trace Derecha -->
  <line x1="560" y1="14" x2="700" y2="14" stroke="rgba(212,155,87,0.3)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="700" cy="14" r="3" fill="#d49b57"/>
  <circle cx="700" cy="14" r="1.2" fill="#0a0e17"/>
</svg>
